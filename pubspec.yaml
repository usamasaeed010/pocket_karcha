name: pocket_karcha
description: Personal expense tracker for Pakistan — Urdu/English, Firebase, Riverpod.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_analytics: ^11.4.6
  cloud_firestore: ^5.6.6

  # Supabase (image storage)
  supabase_flutter: ^2.9.1

  # UI & media
  fl_chart: ^0.70.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13+13
  image_picker_platform_interface: ^2.11.0
  flutter_image_compress: ^2.4.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  country_code_picker: ^3.3.0
  flutter_contacts: ^2.1.0
  permission_handler: ^12.0.2
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  firebase_messaging: ^15.2.10
  speech_to_text: ^7.4.0
  firebase_app_check: ^0.3.2+10
  pdf: ^3.12.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    # Urdu font for exported PDF reports (not used by the app UI).
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-LICENSE.txt
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
